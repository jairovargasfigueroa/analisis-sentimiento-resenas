# Fuente única de parámetros del proyecto.
# Cambias un valor aquí, reentrenas (python -m src.models.train) y la API sirve el modelo nuevo.
# Así se resuelven casi todas las modificaciones en vivo sin tocar código.
#
# Responsables de cada sección (cambios por PR):
#   data, labels, nlp, api -> Brayan (Parte 1 · Predicción)
#   tfidf, experiments     -> Jairo  (Parte 2 · Análisis y métricas)

seed: 42

data:
  raw_dir: data/raw/
  processed_path: data/processed/noticias.csv
  test_size: 0.20          # prueba estratificada; nunca se usa para ajustar nada

labels: [falsa, verdadera]   # orden fijo: índice 0 y 1

nlp:
  # Se QUITAN de la lista de stop words de NLTK porque son negaciones:
  # "no hay vacuna" y "hay vacuna" afirman cosas opuestas. Escribirlas sin tildes.
  # "no" va entre comillas: sin ellas YAML lo lee como el booleano false.
  conservar: ["no", ni, nunca, sin, tampoco]
  # Palabras del dominio que se AGREGAN como stop words (se completan según la EDA).
  agregar: []

tfidf:
  max_features: 20000      # tamaño máximo del vocabulario
  min_df: 2                # ignora términos en menos de 2 noticias
  max_df: 0.90             # ignora términos en más del 90 % de las noticias
  sublinear_tf: true       # 1 + log(tf)

experiments:
  cv_folds: 5
  scoring: f1_macro
  modos: [stem, lema]               # experimento E1
  ngram_ranges: [[1, 1], [1, 2]]    # experimento E2
  models:
    regresion_logistica:
      C: [0.1, 1.0, 10.0, 30.0]   # sin class_weight: las clases están balanceadas (777/766)
    naive_bayes:
      alpha: [0.05, 0.1, 0.5, 1.0]

api:
  max_chars: 20000         # el 99,5 % de las noticias mide menos de 13.600 caracteres; solo 2 de 1.542 pasan de 20.000
  min_palabras: 20         # con menos palabras no hay base para decidir
  max_textos_lote: 100
